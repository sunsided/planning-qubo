[package]
name = "planning-qubo"
description = "Planning, scheduling and constraint problems as QUBO and Ising models: encoders, decoders, penalty tuning, classical samplers and export for quantum annealers and QAOA"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/planning-qubo"
readme = "README.md"
keywords = ["qubo", "ising", "planning", "annealing", "quantum"]
categories = ["algorithms", "mathematics", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
# exp for the annealing acceptance test; core has no float math in no_std.
libm = "0.2.16"
# The RNG trait that the simulated annealing sampler takes, so callers pick a seedable RNG.
rand_core = { version = "0.10.1", default-features = false }
# The Budget trait shared by the planning crates, for time-sliced sampling.
search-core = { version = "0.3.2", default-features = false }

[dev-dependencies]
allocation-counter = "0.8.1"
proptest = "1.12.0"
rand_pcg = "0.10.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
